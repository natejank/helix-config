theme = "autumn"

[editor]
completion-timeout = 150
end-of-line-diagnostics = "info"

[editor.indent-guides]
render = true
character = "▏"
skip-levels = 1

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[keys.normal]
X = ["extend_line_up", "extend_to_line_bounds"]
A-x = "extend_to_line_bounds"

[keys.select]
X = ["extend_line_up", "extend_to_line_bounds"]
A-x = "extend_to_line_bounds"
